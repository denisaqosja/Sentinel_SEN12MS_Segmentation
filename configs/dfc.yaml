seed: 42
device: cuda

paths:
  output_dir: ./experiments/
  resume_checkpoint: null
  validate_checkpoint: null

data:
  dataset: dfc2020
  root_dir: ./Datasets/DFC_Public_Dataset/sensors
  input_modalities: [s2, dfc] # will use only s2 and dfc for training, no s1 will be used for now
  image_size: 256
  batch_size: 128
  val_batch_size: 64
  num_workers: 4
  modality_mode: "single"  # "single" or "multi" modality mode.
  pin_memory: true
  drop_last: false
  ignore_index: 255
  train:
    used_data_fraction: 1.0
  val:
    used_data_fraction: 1.0

model:
  name: segformer  # add dino v3
  pretrained: true
  num_classes: 8
  input_channels: 3   # for s2 using only RGB.
  segformer_name: nvidia/mit-b0  # 
  deeplab_encoder: resnet50
  encoder_weights: imagenet

training:
  epochs: 50
  learning_rate: 0.00006
  weight_decay: 0.01
  amp: true
  save_every: 1
